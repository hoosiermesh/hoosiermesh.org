baseURL: "https://hoosiermesh.org/"
title: "Hoosier Mesh"
theme: ["blowfish"]

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableEmoji: true

menu:
  main:
    - name: Home
      pageRef: "/"
      weight: 10
    - name: About
      pageRef: "/about/"
      weight: 20
    - name: Docs
      pageRef: "/docs/"
      weight: 30
    - name: Events
      pageRef: "/events/"
      weight: 40
    - name: Community
      pageRef: "/community/"
      weight: 50
    - name: Map
      url: "https://meshmap.tranziq.net/"
      weight: 60

params:
  colorScheme: "blowfish"
  defaultAppearance: "dark"
  autoSwitchAppearance: true
  enableSearch: true
  enableCodeCopy: true
  description: "Community-powered connectivity for Indiana."
  logo: "/images/hm_main.svg"
  mainSections:
    - docs

languages:
  en:
    languageName: "English"
    title: "Hoosier Mesh"
    params:
      description: "Hoosier Mesh community site"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: "tango"

services:
  googleAnalytics:
    id: "G-8PRB1BC20C"
