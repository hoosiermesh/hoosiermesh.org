<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" style="background: transparent;">
    
    <defs>
      <!-- Reusable clean 5-point star path to be scattered around -->
      <path id="star" d="M 0 -10 L 2.2 -3.1 L 9.5 -3.1 L 3.6 1.2 L 5.9 8.1 L 0 3.8 L -5.9 8.1 L -3.6 1.2 L -9.5 -3.1 L -2.2 -3.1 Z" fill="#ffb900"/>
    </defs>

    <!-- Background color perfectly matched to #13192a -->
    

    <!-- WiFi Signals: 3 arcs on each side, all centered on (250,250) -->
    <g id="wifi-signals" fill="none" stroke="#67EA94" stroke-width="20" stroke-linecap="round">
      <!-- Left side arcs (3 total) -->
      <path d="M 186.36 186.36 A 90 90 0 0 0 186.36 313.64"/>
      <path d="M 143.93 143.93 A 150 150 0 0 0 143.93 356.07"/>
      <path d="M 101.51 101.51 A 210 210 0 0 0 101.51 398.49"/>
      
      <!-- Right side arcs (3 total) -->
      <path d="M 313.64 186.36 A 90 90 0 0 1 313.64 313.64"/>
      <path d="M 356.07 143.93 A 150 150 0 0 1 356.07 356.07"/>
      <path d="M 398.49 101.51 A 210 210 0 0 1 398.49 398.49"/>
    </g>

    <!-- State Flag Torch, moved up more for clear spacing -->
    <g id="torch-centered" fill="#ffb900" transform="translate(250, 200) scale(1.1) translate(-375, -260)">
      <!-- Authentic Flame and Handle Paths ONLY (Radiating rays removed) -->
      <path d="M346.554 222.899c-.038-.045-.076-.1-.113-.154-18.529-22.737.765-33.618.685-49.705 12.084 20.987-5.161 25.641 15.324 49.875l-15.896-.016zm20.031.013c-6.639-8.982-11.104-24.566-8.815-33.848 1.829-7.413 8.75-15.504 7.064-25.437 1.544 2.562 5.203 9.514 6.4 16.071 5.832-15.071 17.337-22.088 32.177-21.763-28.454 21.622 8.544 38.045-16.016 65.003l-20.81-.026zm26.083.038c7.478-11.212 9.199-17.426 9.141-23.205-.045-4.544-.543-10.22-1.013-13.512-.944-6.607 3.731-15.006 13.728-16.825-1.716 1.829-3.236 5.669-4.017 7.581-.926 2.268-1.218 4.561-.632 8.555 1.225 4.641.654 11.426-.896 14.413-1.483.409 6-12.009 10.061-12.329-3.813 6.541-2.322 15.766-7.793 24.794-2.014 3.324-5.474 7.131-9.725 10.527m-12.916 58.954c1.008-25.563 6.477-33.53 16.847-44.221-20.122-.048-42.609.011-60.906-.064 10.326 10.707 15.85 18.743 16.804 44.303l27.255-.018zm-13.667 62.282l7.961 24.97 4.397-74.147c-8.198-.028-16.396.024-24.594.012l4.22 74.119 8.016-24.954zm.009 102.50c3.512-3.257 4.509-13.866 4.509-13.866l2.185-45.299-6.635-4.662-6.649 4.647 2.115 45.31s.942 10.579 4.459 13.873l.016-.003z"/>
      <path d="M356.245 284.33h37.509v8.35h-37.509v-8.35z"/>
    </g>

    <!-- The torch's flame path above already includes the authentic tapered
         handle (the hourglass pinch and pointed tip), straight from the
         original flag artwork — no extra shapes needed here. -->


    <!--
      19 stars: 9 on the left side and 9 on the right side (even split),
      each row sitting in the radial gaps between the wifi arcs and curving
      in line with them. One extra star above the torch is kept as the
      unpaired 19th star, needed since 19 is odd.
    -->
    <g id="scattered-stars">
      <!-- Star filling the pinch in the torch handle, positioned and sized to match the original flag exactly (the odd one out, needed for 19 total) -->
      <use href="#star" transform="translate(250, 323) scale(1.7)"/>

      <!-- Between the inner and middle arcs (radius 120), left side: 4 stars -->
      <use href="#star" transform="translate(154, 322) scale(0.85)"/>
      <use href="#star" transform="translate(133, 276) scale(0.85)"/>
      <use href="#star" transform="translate(133, 224) scale(0.85)"/>
      <use href="#star" transform="translate(154, 178) scale(0.85)"/>

      <!-- Between the inner and middle arcs (radius 120), right side: 4 stars -->
      <use href="#star" transform="translate(346, 178) scale(0.85)"/>
      <use href="#star" transform="translate(367, 224) scale(0.85)"/>
      <use href="#star" transform="translate(367, 276) scale(0.85)"/>
      <use href="#star" transform="translate(346, 322) scale(0.85)"/>

      <!-- Between the middle and outer arcs (radius 180), left side: 5 stars -->
      <use href="#star" transform="translate(110, 137) scale(0.95)"/>
      <use href="#star" transform="translate(80, 190) scale(0.95)"/>
      <use href="#star" transform="translate(70, 250) scale(0.95)"/>
      <use href="#star" transform="translate(80, 310) scale(0.95)"/>
      <use href="#star" transform="translate(110, 363) scale(0.95)"/>

      <!-- Between the middle and outer arcs (radius 180), right side: 5 stars -->
      <use href="#star" transform="translate(390, 137) scale(0.95)"/>
      <use href="#star" transform="translate(420, 190) scale(0.95)"/>
      <use href="#star" transform="translate(430, 250) scale(0.95)"/>
      <use href="#star" transform="translate(420, 310) scale(0.95)"/>
      <use href="#star" transform="translate(390, 363) scale(0.95)"/>
    </g>

  </svg>